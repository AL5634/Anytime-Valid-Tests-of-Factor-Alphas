# ============================================================
# Configuration for E-value Factor Zoo Analysis
# Target journal: Journal of Empirical Finance
# ============================================================

# --- E-value parameters -------------------------------------
evalue:
  alpha: 0.05              # significance level
  threshold: 20            # e-value rejection threshold (1/alpha)
  # Lindon et al. (2026) regression e-values use a mixture precision
  # parameter g -- no explicit delta_min needed. For the safe
  # t-test / betting e-process used as a robustness cross-check, we
  # grid over economically meaningful annualized-alpha thresholds.
  delta_min_annual_pct: [1, 2, 3, 5]
  default_delta_min_annual_pct: 2
  min_obs: 60              # minimum months before first e-value
  reestimate_every: 12     # re-estimate model every k months
  n_jobs: -1               # parallel workers for factor e-value batch
  clip_scale: 3            # clip bound B = clip_scale * residual sigma

# --- Empirical design ---------------------------------------
empirical:
  universe: "cz"           # cz = Chen-Zimmermann 212-predictor LS | kf = Ken French 16-zoo
  train_start: "1963-07"
  train_end: "2005-12"
  test_start: "2006-01"
  test_end: "2023-12"      # CZ release ends 2023-12; never 2026-06
  # Additional splits for robustness (module 8)
  alt_splits:
    - [ "1973-07", "2005-12", "2006-01", "2023-12" ]
    - [ "1963-07", "1995-12", "1996-01", "2023-12" ]
  factor_model: "FF5"      # CAPM | FF3 | FF5
  ff5_factors: [MKT, SMB, HML, RMW, CMA]
  ff3_factors: [MKT, SMB, HML]
  capm_factors: [MKT]
  exclude_microcap: true
  microcap_threshold_pctile: 0.20   # NYSE 20th percentile

# --- Screening methods (OOS horse race) ---------------------
screening:
  evalue_threshold: 20
  hlz_t_threshold: 3.0
  eb_fdr_q: 0.05          # empirical-Bayes shrinkage q-quantile cutoff
  traditional_t_threshold: 2.0
  # null -> each method selects according to its own criterion ("natural
  # fork"); set to an integer N to cap every method at its top-N for a
  # strict count-equalized comparison (reported as robustness in the paper).
  n_factors_equalize: null

# --- Cross-market validation --------------------------------
cross_market:
  markets: [US, DEV_EX_US, EM]
  global_threshold: 20

# --- Data paths ---------------------------------------------
data:
  raw_public: "data/downloaded"
  processed: "data/processed"
  results: "data/results"

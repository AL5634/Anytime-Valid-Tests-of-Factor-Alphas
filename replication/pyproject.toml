[project]
name = "evalue-factor-zoo"
version = "0.1.0"
description = "Anytime-valid (e-value) inference for asset-pricing factor validation — replication package."
requires-python = ">=3.10"
dependencies = [
    "statsmodels>=0.14",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "joblib>=1.3",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
